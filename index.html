<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reja va Fokus</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Reja">
<style>
:root{--bg:#f3f6f5;--c:#fff;--t:#14211f;--m:#5f726f;--a:#0f766e;--ok:#15803d;--no:#c2410c;--b:#dbe5e3}
@media(prefers-color-scheme:dark){:root{--bg:#0d1514;--c:#152220;--t:#e6f0ee;--m:#8aa09c;--a:#2dd4bf;--ok:#4ade80;--no:#fb923c;--b:#244039}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:14px}h1{font-size:22px;margin:6px 0 12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
input,select,button{font:inherit;color:inherit;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px}
input[type=text]{flex:1;min-width:0}input[type=checkbox]{width:22px;height:22px;accent-color:var(--a)}
button{cursor:pointer}.p{background:var(--a);color:var(--bg);border:0;font-weight:600}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}.it:last-child{border:0}.it>span{flex:1}.dn>span{text-decoration:line-through;color:var(--m)}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .card{margin:0}.k{text-align:center}.k b{font-size:28px;display:block}.s{color:var(--m);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;color:var(--m);padding:8px 0}nav button.on{color:var(--a);font-weight:700}nav em{display:block;font-style:normal;font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--a);color:var(--bg);border:0}
.up{color:var(--ok)}.dw{color:var(--no)}.g+.card{margin-top:12px}
</style></head><body><main></main><nav></nav>
<script>
const $=s=>document.querySelector(s),L={y:'Yillik',m:'Oylik',w:'Haftalik',d:'Kunlik'},O='ymwd';
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D0=()=>({g:[],f:[],dis:{},use:{},lim:120});
let S;try{S=JSON.parse(localStorage.getItem('rf'))}catch(x){}S=S||D0();
const save=()=>{try{localStorage.setItem('rf',JSON.stringify(S))}catch(x){}};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},mon=d=>addD(d,-((d.getDay()+6)%7));
const wk=d=>{const m=mon(d),t=addD(m,3),j=new Date(t.getFullYear(),0,4);return t.getFullYear()+'-H'+pad(1+Math.round((m-mon(j))/6048e5))};
const key=(l,d)=>l=='d'?ymd(d):l=='w'?wk(d):l=='m'?ymd(d).slice(0,7):''+d.getFullYear();
const now=new Date(),td=ymd(now);let tab='t',lv='y';
const prog=g=>{const c=S.g.filter(x=>x.par==g.id);return c.length?c.reduce((a,x)=>a+prog(x),0)/c.length:g.done?100:0};
const dayRate=ds=>{const t=S.g.filter(x=>x.lv=='d'&&ds.includes(x.p));return t.length?Math.round(100*t.filter(x=>x.done).length/t.length):null};
const range=(a,b)=>{const r=[];for(let d=new Date(a);d<=b;d=addD(d,1))r.push(ymd(d));return r};
function streak(){let n=0,d=new Date(now);for(let i=0;i<400;i++){const r=dayRate([ymd(d)]);if(r!==null&&r>=70)n++;else if(i>0)break;d=addD(d,-1)}return n}
const tr=(a,b)=>{if(a===null)return'—';if(b===null)return'';const d=a-b;return`<span class="${d>=0?'up':'dw'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span>`};
const po=l=>'<option value="">Maqsodga bog\'lamaslik</option>'+[...O.slice(0,O.indexOf(l))].flatMap(h=>S.g.filter(x=>x.lv==h&&x.p==key(h,now)).map(x=>`<option value="${x.id}">${L[h]}: ${e(x.t)}</option>`)).join('');
const form=l=>`<div class="card"><div class="row"><input type="text" id="ni" placeholder="Yangi ${l=='d'?'vazifa':L[l].toLowerCase()+' maqsod'}" onkeydown="if(event.key=='Enter')add('${l}')"><button class="p" onclick="add('${l}')">Qo'shish</button></div>${l=='y'?'':`<select id="np" style="width:100%;margin-top:8px">${po(l)}</select>`}</div>`;
function add(l){const t=$('#ni').value.trim();if(!t)return;S.g.push({id:Date.now()+Math.random().toString(36).slice(2,5),t,lv:l,p:key(l,now),par:($('#np')||{}).value||null,done:false});save();go()}
function tg(id){const g=S.g.find(x=>x.id==id);g.done=!g.done;save();go()}
function del(id){S.g=S.g.filter(x=>x.id!=id);S.g.forEach(x=>{if(x.par==id)x.par=null});save();go()}
const row=g=>`<div class="it ${g.done?'dn':''}"><input type="checkbox" ${g.done?'checked':''} onchange="tg('${g.id}')"><span>${e(g.t)}</span><button onclick="del('${g.id}')" aria-label="O'chirish">✕</button></div>`;
const gr=g=>{const h=S.g.some(x=>x.par==g.id),p=Math.round(prog(g));return`<div class="it ${g.done&&!h?'dn':''}">${h?'':`<input type="checkbox" ${g.done?'checked':''} onchange="tg('${g.id}')">`}<span>${e(g.t)}${h?`<div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div>`:''}</span><b class="s">${p}%</b><button onclick="del('${g.id}')" aria-label="O'chirish">✕</button></div>`};
const T={min:25,left:1500,on:false,end:0},tmTxt=()=>pad(Math.floor(T.left/60))+':'+pad(T.left%60);
function tgT(){if(T.on){T.left=Math.ceil((T.end-Date.now())/1000);T.on=false}else{T.end=Date.now()+T.left*1000;T.on=true}go()}
function rsT(){T.on=false;T.left=T.min*60;go()}
function setT(){T.min=+$('#tl').value;rsT()}
setInterval(()=>{if(!T.on)return;T.left=Math.ceil((T.end-Date.now())/1000);if(T.left<=0){T.on=false;T.left=T.min*60;S.f.push({d:td,m:T.min});save();try{navigator.vibrate&&navigator.vibrate(300)}catch(x){}go();alert('Fokus seansi tugadi!')}else if($('#tm'))$('#tm').textContent=tmTxt()},500);
const V={
t(){const a=S.g.filter(x=>x.lv=='d'&&x.p==td),r=dayRate([td]);return`<h1>Bugun, ${td}</h1><div class="card"><div class="row"><div class="bar" style="flex:1"><i style="width:${r||0}%"></i></div><b>${r||0}%</b></div></div><div class="card">${a.map(row).join('')||'<span class="s">Bugun uchun vazifa yo\'q. Pastdan qo\'shing.</span>'}</div>${form('d')}`},
r(){const a=S.g.filter(x=>x.lv==lv&&x.p==key(lv,now));return`<h1>Reja</h1><div class="tabs">${['y','m','w'].map(l=>`<button class="${l==lv?'on':''}" onclick="lv='${l}';go()">${L[l]}</button>`).join('')}</div><div class="card"><div class="s">${key(lv,now)}</div>${a.map(gr).join('')||'<span class="s">Bu davr uchun maqsod yo\'q.</span>'}</div>${form(lv)}`},
d(){const ws=mon(now),W=range(ws,addD(ws,6)),PW=range(addD(ws,-7),addD(ws,-1)),y=now.getFullYear(),mo=now.getMonth(),M=range(new Date(y,mo,1),new Date(y,mo+1,0)),PM=range(new Date(y,mo-1,1),new Date(y,mo,0));
const rt=[['Bugun',dayRate([td]),null],['Shu hafta',dayRate(W),dayRate(PW)],['Shu oy',dayRate(M),dayRate(PM)]];
const days=range(addD(now,-13),now),bw=100/14,bars=days.map((d,i)=>{const r=dayRate([d])||0;return`<rect x="${i*bw+1}" y="${100-r}" width="${bw-2}" height="${r}" rx="2" fill="var(--a)"/>`}).join('');
const gs=S.g.filter(x=>x.lv!='d'&&x.p==key(x.lv,now));
return`<h1>Dashboard</h1><div class="g">${rt.map(([n,a,b])=>`<div class="card k"><b>${a===null?'—':a+'%'}</b><div class="s">${n}</div><div>${n=='Bugun'?'':tr(a,b)}</div></div>`).join('')}<div class="card k"><b>🔥 ${streak()}</b><div class="s">Streak (kuniga ≥70%)</div></div></div><div class="card"><div class="s">Oxirgi 14 kun: bajarilish foizi</div><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:120px;margin-top:6px">${bars}</svg></div><div class="card"><div class="s">Maqsodlar taraqqiyoti</div>${gs.map(g=>{const p=Math.round(prog(g));return`<div style="margin:10px 0"><div class="row"><span style="flex:1">${L[g.lv]}: ${e(g.t)}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')||'<span class="s">Reja bo\'limida maqsod qo\'shing.</span>'}</div>`},
f(){const u=S.use[td]||0,o=u>S.lim,m=S.f.filter(x=>x.d==td).reduce((a,x)=>a+x.m,0);
return`<h1>Fokus</h1><div class="card k"><b id="tm">${tmTxt()}</b><div class="row" style="justify-content:center;margin-top:8px"><select id="tl" onchange="setT()">${[15,25,45,60].map(n=>`<option ${n==T.min?'selected':''}>${n}</option>`).join('')}</select><button class="p" onclick="tgT()">${T.on?'Pauza':'Boshlash'}</button><button onclick="rsT()">Qayta</button></div><div class="s" style="margin-top:8px">Bugun fokusda: ${m} daq. Chalg'ish: ${S.dis[td]||0} marta</div><button style="margin-top:8px" onclick="S.dis[td]=(S.dis[td]||0)+1;save();go()">Chalg'idim (+1)</button></div><div class="card"><div class="s">Telefon ekran vaqti bugun va kunlik limit (daqiqa)</div><div class="row" style="margin-top:6px"><input type="number" value="${u}" inputmode="numeric" style="flex:1;min-width:0" onchange="S.use[td]=+this.value||0;save();go()"><span class="s">limit</span><input type="number" value="${S.lim}" inputmode="numeric" style="width:80px" onchange="S.lim=+this.value||60;save();go()"></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,100*u/S.lim)}%;background:var(${o?'--no':'--ok'})"></i></div><div class="${o?'dw':'s'}" style="margin-top:6px">${o?'Limitdan oshdingiz. Telefonni qo\'ying.':'Limitgacha '+(S.lim-u)+' daqiqa qoldi'}</div></div><div class="card s">Boshqa ilovalarni haqiqatan to'sish keyingi bosqichda (Android ilova).</div>`},
s(){return`<h1>Sozlamalar</h1><div class="card"><button onclick="ex()" style="width:100%">Ma'lumotni yuklab olish (JSON)</button><input type="file" id="imf" accept=".json" onchange="imp(this)" style="margin-top:8px;width:100%"><div class="s" style="margin-top:8px">Ma'lumotlar shu telefonda saqlanadi. Boshqa telefonga o'tkazish uchun yuklab olib, shu yerdan tiklang.</div></div><div class="card"><button onclick="if(confirm('Hamma ma\\'lumot o\\'chadi. Davom etasizmi?')){S=D0();save();go()}" style="width:100%;color:var(--no)">Hammasini tozalash</button></div>`}};
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='reja-'+td+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.g))throw 0;S=Object.assign(D0(),d);save();go()}catch(x){alert('Fayl noto\'g\'ri')}};r.readAsText(f)}
const N=[['t','📅','Bugun'],['r','🎯','Reja'],['d','📊','Dashboard'],['f','⏱','Fokus'],['s','⚙️','Sozlamalar']];
function go(){$('main').innerHTML=V[tab]();$('nav').innerHTML=N.map(([k,i,n])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';go()"><em>${i}</em>${n}</button>`).join('')}
document.addEventListener('visibilitychange',()=>{if(ymd(new Date())!=td)location.reload()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go();
</script></body></html>
